ShortDescription: Open-source SSH client with SFTP, remote desktop, port tunneling and database tools.
Description: |-
  Reach is a cross-platform SSH client with a native interface: SSH terminals in tabs, an SFTP file explorer,
  jump hosts, port forwarding, a serial console and remote desktop over RDP. Sessions and keys live in an
  encrypted vault with optional sync. Optional DevOps tools, switched on in Settings, add a database workspace
  for PostgreSQL, MySQL, MariaDB, SQL Server, SQLite and Redis, plus Ansible and OpenTofu.
